# fork 专用：构建容器镜像并推送到**你自己的** GHCR（可选 Docker Hub）。
#
# 上游的镜像由维护者在发版时构建，你不需要它也能用本项目。这份文件是给「想用
# 自己构建的镜像」的人：改了代码、换了默认配置，或者只是不想依赖别人的镜像仓库。
#
# ── 怎么用 ─────────────────────────────────────────────────────
#
#   在 fork 里把本文件复制到 .github/workflows/ 下：
#
#     mkdir -p .github/workflows
#     cp deploy/fork-image/build-image.yml .github/workflows/
#     git add .github/workflows/build-image.yml
#     git commit -m "ci: 构建自己的镜像" && git push
#
#   推上去会自动构建（也可到 Actions 页手动触发「Build Image」）。完成后拉取
#   你自己那一份：
#
#     docker pull ghcr.io/<你的用户名>/workbuddy-manager-multiarch:latest
#
#   <你的用户名> 不用自己算：构建完到那次运行页面的摘要里看，会直接列出可以粘贴
#   的拉取命令。
#
# ── 零配置：全部按你 fork 的实际情况自动决定 ────────────────────
#
#   本文件不需要改任何内容。下面这几项都是运行时从仓库信息推出来的：
#
#     · 镜像归属 → 谁 fork 就推到谁的名下（取仓库所有者，并强制转小写 —— 因为
#                  GHCR 不接受含大写的镜像名）
#     · 触发分支 → 该仓库的**默认分支**，不写死 main。分支叫别的名字也照样触发
#     · 来源标签 → 镜像里的 org.opencontainers.image.source / revision 指向你的
#                  fork 与那次提交，日后能核对「拉到的是哪来的镜像」
#     · Docker Hub → 有那两个 Secret 就推、没有就跳过，同样不用改文件
#
# ── 为什么镜像名比上游多一个 -multiarch ────────────────────────
#
# 不用上游那个 workbuddy-manager 包名，是因为它可能已经被一个**没有链接到本
# 仓库**的同名包占用 —— 那种包 fork 的令牌拿不到写权限，推送会被拒。换个包名
# 最省事，顺带也避免和上游的镜像混在一起认不出来。
#
# ── 它不做什么 ─────────────────────────────────────────────────
#
# 不创建 Release —— 发布包只由上游维护者正式发出。在 fork 上造一个 Release，
# 用户端的一键更新会照装（2026-10-13 起包只做摘要校验），属于「看着能装、
# 实际装不上」，不如不做。
#
# ── Docker Hub（可选，默认关）──────────────────────────────────
#
# 想同时推 Docker Hub，加两个仓库 Secret 即可，**不用改本文件**：
#
#     DOCKERHUB_USERNAME = 你的 Docker Hub 用户名
#     DOCKERHUB_TOKEN    = Access Token（不是登录密码，权限选 Read & Write）
#
# 两个都没配时，Docker Hub 那几步自动跳过，不会把工作流标红。
#
# ── 多架构 ────────────────────────────────────────────────────
#
# 同时构建 linux/amd64 与 linux/arm64 并合并成一个 manifest list，拉取时按机器
# 架构自动选择，Apple Silicon 与 ARM 云主机不必靠 QEMU 模拟跑。

name: Build Image

on:
  push:
    # 这里**刻意不写分支名**。写死 main 的话，fork 之后要是把默认分支改了名（或者
    # 从别的分支 fork 出来），这个工作流就再也不会触发 —— 而且它不报错，只是安静
    # 地什么都不做，这种失效很难查。改成「任何分支的推送都先放进来」，再由下面 job
    # 上的 if 判断是不是本仓库的默认分支。
    #
    # 只有会影响镜像内容的改动才重建。arm64 那一份是在 amd64 机器上靠 QEMU
    # 交叉构建的，一次要跑好几分钟，纯文档改动不值得跑。
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'server/**'
      - 'web/**'
      - 'deploy/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

# 连续推两次时排队而不是互相打断：两个运行同时推同一批标签，latest 会指向谁
# 不好说。（排队，不取消。）
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # 推镜像到 GHCR 必须显式声明；只给 contents 会被拒。
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 只在**本仓库的默认分支**上构建，分支叫什么名字都行。其余分支的推送会进到这里
    # 但被跳过 —— 跳过不消耗构建时间，也不会让 latest 标签被 feature 分支覆盖。
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 先把前端构建好，再交给 Dockerfile 复用（Dockerfile 的逻辑是「有 web/out
      # 就直接用，没有才在容器里现场构建」）。好处有两个：
      #   · arm64 那一份靠 QEMU 交叉构建，若让装依赖与编译也跑在模拟环境里，
      #     会成为整个构建最慢的一段；
      #   · 前端构建失败会在**构建镜像之前**就报出来，不必等几分钟才发现。
      # Node 版本与 Dockerfile 里的 node:20-slim 对齐。
      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端静态导出
        working-directory: web
        run: |
          npm ci
          npm run build:export

      - name: 校验前端产物
        run: |
          test -f web/out/index.html || { echo "构建失败：缺少 web/out/index.html"; exit 1; }
          echo "前端产物：$(du -sh web/out | cut -f1)"

      # 凭据不能写在校验条件的表达式里，所以先把「有没有配 Docker Hub」
      # 算成一个输出，后面的步骤再据此决定要不要登录。
      - name: 检查 Docker Hub 凭据
        id: hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 凭据已配置，将同时推送"
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "未配置 Docker Hub 凭据，本次只推 GHCR（这是正常的）"
          fi

      - name: 解析镜像名与标签
        id: image
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # 下面这行小写转换**不能省**：GHCR 要求镜像名全小写，而用户名可能含
          # 大写字母，直接拼进去会被拒收（报 repository name must be lowercase）。
          # 改这里之前请看 server/tests/test_docker_deploy.py 里的说明。
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/workbuddy-manager-multiarch"
          IMAGE="${IMAGE,,}"
          SHORT="${GITHUB_SHA::7}"

          # latest 跟着 main 走；sha-<短哈希> 是内容寻址的固定指针，拿它可以
          # 核对「拉到的就是那次提交构建出来的那份」。
          TAGS="${IMAGE}:latest"$'\n'"${IMAGE}:sha-${SHORT}"
          NAMES="${IMAGE}"

          if [ "${{ steps.hub.outputs.enabled }}" = "1" ]; then
            HUB="docker.io/${HUB_USER}/workbuddy-manager-multiarch"
            TAGS="${TAGS}"$'\n'"${HUB}:latest"$'\n'"${HUB}:sha-${SHORT}"
            NAMES="${NAMES}"$'\n'"${HUB}"
          fi

          # 多行输出用 heredoc 写法（name<<EOF … EOF）
          {
            echo "tags<<__TAGS__"
            printf '%s\n' "$TAGS"
            echo "__TAGS__"
            echo "names<<__NAMES__"
            printf '%s\n' "$NAMES"
            echo "__NAMES__"
          } >> "$GITHUB_OUTPUT"

          echo "本次将推送："
          printf '%s\n' "$TAGS"

      - name: 设置 QEMU
        # amd64 的机器上构建 arm64 层需要它（模拟出 arm64 执行环境）
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: steps.hub.outputs.enabled == '1'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # 两个架构合并成一个 manifest list，本地镜像库放不下它，
          # 所以必须直接推送到仓库（不能只构建不推）。
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.title=WorkBuddy Manager
            org.opencontainers.image.description=腾讯 CodeBuddy 账号池管理控制台 · OpenAI 兼容网关
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          tags: ${{ steps.image.outputs.tags }}
          # 关掉这个证明：它会在 manifest list 里塞进 attestation 条目，某些
          # 旧版 Docker 拉取时报 unknown/unknown platform。本项目不依赖它。
          provenance: false
          # 复用上一次的层缓存，省掉 apt / pip / npm 那几层的重复下载。
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出结果
        run: |
          # 摘要是给人看的，所以这里直接给出**可以原样粘贴**的命令 —— 文档里只能写
          # `ghcr.io/<你的用户名>/…` 这种占位符，真实镜像名只有跑到这一步才知道。
          PULL_IMAGE=$(printf '%s\n' "${{ steps.image.outputs.names }}" | head -n 1)
          {
            echo "## 镜像已推送"
            echo ""
            echo "拉取（把下面这行原样复制即可，用户名已替换成实际值）："
            echo ""
            echo '```bash'
            echo "docker pull ${PULL_IMAGE}:latest"
            echo '```'
            echo ""
            echo "全部标签："
            echo ""
            echo '```'
            echo "${{ steps.image.outputs.names }}" | while read -r n; do
              [ -n "$n" ] || continue
              echo "$n:latest"
              echo "$n:sha-${GITHUB_SHA::7}"
            done
            echo '```'
            echo ""
            echo "平台：linux/amd64, linux/arm64（拉取时按机器架构自动选择）"
            echo ""
            echo "digest：\`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
