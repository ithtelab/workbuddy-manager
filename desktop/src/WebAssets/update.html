<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>软件更新</title>
<style>
  :root{
    --bg:#0c0c0e; --card:#131316; --border:rgba(255,255,255,.08);
    --text:#f4f4f5; --muted:#a1a1aa; --accent:#f59e0b; --ok:#22c55e;
    --danger:#ef4444; --track:rgba(255,255,255,.07); --soft:rgba(255,255,255,.04);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fafafa; --card:#fff; --border:rgba(0,0,0,.08);
           --text:#18181b; --muted:#71717a; --track:rgba(0,0,0,.07); --soft:rgba(0,0,0,.03); }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
    display:flex;flex-direction:column;padding:26px 26px 22px;gap:18px;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .head{display:flex;align-items:center;gap:14px;flex:0 0 auto}
  .logo{width:46px;height:46px;border-radius:14px;flex:0 0 auto}
  .titles{flex:1;min-width:0}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.2px}
  .sub{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .body{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;overflow:hidden}

  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:2.5px solid var(--track);border-top-color:var(--accent);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px}
  .icon.ok{background:rgba(34,197,94,.12);color:var(--ok)}
  .icon.err{background:rgba(239,68,68,.12);color:var(--danger)}
  .title-lg{font-size:16px;font-weight:600}
  .muted{font-size:12.5px;color:var(--muted);line-height:1.7;white-space:pre-wrap;word-break:break-word}

  .versions{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0}
  .ver{
    font-size:14px;font-variant-numeric:tabular-nums;padding:7px 14px;border-radius:10px;
    background:var(--soft);border:1px solid var(--border);
  }
  .ver.new{color:var(--accent);border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.08);font-weight:600}
  .arrow{color:var(--muted);font-size:16px}

  .notes{
    font-size:12px;line-height:1.65;color:var(--muted);white-space:pre-wrap;word-break:break-word;
    background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
    overflow:auto;flex:1;min-height:90px;
  }
  .notes:empty{display:none}
  #notes{white-space:normal}
  #notes h1,#notes h2,#notes h3,#notes h4{font-size:12.5px;font-weight:600;color:var(--text);margin:12px 0 6px}
  #notes h1:first-child,#notes h2:first-child,#notes h3:first-child,#notes h4:first-child{margin-top:0}
  #notes p{margin:6px 0}
  #notes ul,#notes ol{margin:6px 0;padding-left:20px}
  #notes li{margin:3px 0}
  #notes code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    font-size:11px;background:var(--track);padding:1px 5px;border-radius:5px;color:var(--text)}
  #notes pre{margin:8px 0;padding:10px 12px;border-radius:8px;background:var(--track);overflow:auto}
  #notes pre code{background:transparent;padding:0}
  #notes a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  #notes blockquote{margin:8px 0;padding-left:10px;border-left:3px solid var(--border);color:var(--muted)}
  #notes hr{border:0;border-top:1px solid var(--border);margin:12px 0}
  #notes strong{color:var(--text);font-weight:600}

  .steps{display:flex;flex-direction:column;gap:9px;padding:4px 2px}
  .step{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);transition:.2s}
  .step .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--track);display:grid;place-items:center;flex:0 0 auto}
  .step .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:transparent}
  .step.done{color:var(--text)}
  .step.done .dot{border-color:var(--ok);background:rgba(34,197,94,.15)}
  .step.done .dot::after{background:var(--ok)}
  .step.current{color:var(--text);font-weight:500}
  .step.current .dot{border-color:var(--accent)}
  .step.current .dot::after{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

  .progress{height:8px;border-radius:99px;background:var(--track);overflow:hidden;flex:0 0 auto}
  .progress > i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .25s ease}
  .progress.indeterminate > i{width:38%;animation:sweep 1.4s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
  .progress-row{display:flex;align-items:center;gap:12px}
  .percent{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}

  .check{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--muted);line-height:1.5;cursor:pointer;user-select:none}
  .check input{margin:2px 0 0;accent-color:var(--accent)}

  .actions{display:flex;gap:10px;justify-content:flex-end;flex:0 0 auto;flex-wrap:wrap}
  .actions .spacer{flex:1}
  button{
    appearance:none;border:1px solid var(--border);background:transparent;color:var(--text);
    border-radius:10px;padding:9px 18px;font-size:13px;cursor:pointer;transition:.15s;
    font-family:inherit;white-space:nowrap;
  }
  button:hover:not(:disabled){background:var(--soft)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--text);color:var(--bg);border-color:transparent;font-weight:500}
  button.primary:hover:not(:disabled){opacity:.9;background:var(--text)}
  button.danger{color:var(--danger);border-color:rgba(239,68,68,.35)}
  button.danger:hover:not(:disabled){background:rgba(239,68,68,.08)}
  .hidden{display:none !important}
</style>
</head>
<body>
  <div class="head">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#1c1c1e"/>
      <circle cx="32" cy="11" r="4" fill="#f59e0b"/>
      <rect x="31" y="13" width="2" height="9" rx="1" fill="#e5e5e5"/>
      <rect x="16" y="22" width="32" height="26" rx="10" fill="#f4f4f5"/>
      <rect x="10" y="30" width="6" height="12" rx="3" fill="#f4f4f5"/>
      <rect x="48" y="30" width="6" height="12" rx="3" fill="#f4f4f5"/>
      <circle cx="26" cy="33" r="3.2" fill="#1c1c1e"/>
      <circle cx="38" cy="33" r="3.2" fill="#1c1c1e"/>
      <path d="M26 42c3 2.5 9 2.5 12 0" stroke="#1c1c1e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="titles">
      <h1>软件更新</h1>
      <div class="sub" id="subtitle"></div>
    </div>
  </div>

  <div class="body">
    <div id="viewChecking" class="center hidden">
      <div class="spinner"></div>
      <div class="muted" id="checkingText">正在查询最新版本…</div>
    </div>

    <div id="viewUpToDate" class="center hidden">
      <div class="icon ok">✓</div>
      <div class="title-lg">已是最新版本</div>
      <div class="muted" id="uptodateText"></div>
    </div>

    <div id="viewAvailable" class="body hidden">
      <div class="versions">
        <span class="ver" id="currentVer"></span>
        <span class="arrow">→</span>
        <span class="ver new" id="latestVer"></span>
      </div>
      <div class="notes" id="notes"></div>
      <label class="check hidden" id="unverifiedBox">
        <input type="checkbox" id="allowUnverified">
        <span>没能取得发布页的 SHA-256。我确认这个包来自官方 Releases，仍然继续（不推荐）。</span>
      </label>
      <div class="muted hidden" id="noInstallHint">当前连接的是另一个目录的实例，这里只能查看更新，不能安装。</div>
    </div>

    <div id="viewProgress" class="body hidden">
      <div class="steps" id="steps">
        <div class="step" data-phase="downloading"><span class="dot"></span><span>下载发布包</span></div>
        <div class="step" data-phase="verifying"><span class="dot"></span><span>校验 SHA-256</span></div>
        <div class="step" data-phase="extracting"><span class="dot"></span><span>解压到临时目录</span></div>
        <div class="step" data-phase="stopping"><span class="dot"></span><span>停止服务</span></div>
        <div class="step" data-phase="replacing"><span class="dot"></span><span>替换程序文件</span></div>
        <div class="step" data-phase="dependencies"><span class="dot"></span><span>同步 Python 依赖</span></div>
        <div class="step" data-phase="starting"><span class="dot"></span><span>重新启动服务</span></div>
      </div>
      <div class="progress-row">
        <div class="progress" id="progress"><i id="progressBar"></i></div>
        <div class="percent" id="percent"></div>
      </div>
      <div class="muted" id="progressMessage"></div>
    </div>

    <div id="viewDone" class="center hidden">
      <div class="icon ok">✓</div>
      <div class="title-lg" id="doneTitle">更新完成</div>
      <div class="muted" id="doneText"></div>
    </div>

    <div id="viewError" class="body hidden">
      <div class="center" style="flex:0 0 auto">
        <div class="icon err">!</div>
        <div class="title-lg">更新没有完成</div>
      </div>
      <div class="notes" id="errorText" style="flex:1"></div>
      <div class="muted">服务当前可能处于停止状态，可以用「回滚」恢复到更新前的版本，或关闭后手动检查。</div>
    </div>
  </div>

  <div class="actions">
    <button id="btnReleases" class="hidden">打开发布页</button>
    <span class="spacer"></span>
    <button id="btnLater" class="hidden">稍后</button>
    <button id="btnRollback" class="danger hidden">回滚</button>
    <button id="btnClose" class="hidden">关闭</button>
    <button id="btnRetry" class="hidden">重试</button>
    <button id="btnInstall" class="primary hidden">立即更新</button>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const order = ['downloading','verifying','extracting','stopping','replacing','dependencies','starting'];
  let state = { phase: 'idle', current: '', latest: '', notes: '', message: '', percent: 0, canRollback: false, sha: '' };

  function send(type, extra) {
    window.chrome?.webview?.postMessage(Object.assign({ type }, extra || {}));
  }

  function hideAll() {
    ['viewChecking','viewUpToDate','viewAvailable','viewProgress','viewDone','viewError'].forEach(id => $(id).classList.add('hidden'));
    ['btnReleases','btnLater','btnRollback','btnClose','btnRetry','btnInstall'].forEach(id => $(id).classList.add('hidden'));
  }

  function setSubtitle() {
    const parts = [];
    if (state.current) parts.push('当前 ' + state.current);
    if (state.latest && state.latest !== state.current) parts.push('最新 ' + state.latest);
    $('subtitle').textContent = parts.join('  ·  ');
  }

  function renderProgress() {
    const idx = order.indexOf(state.phase);
    document.querySelectorAll('.step').forEach((el) => {
      const i = order.indexOf(el.dataset.phase);
      el.classList.toggle('done', i < idx);
      el.classList.toggle('current', i === idx);
    });
    const bar = $('progress');
    const fill = $('progressBar');
    const downloading = state.phase === 'downloading';
    bar.classList.toggle('indeterminate', !downloading);
    if (downloading) {
      const p = Math.max(0, Math.min(100, Number(state.percent) || 0));
      fill.style.width = p + '%';
      $('percent').textContent = p > 0 ? p.toFixed(0) + '%' : '';
    } else {
      fill.style.width = '';
      $('percent').textContent = '';
    }
    $('progressMessage').textContent = state.message || '';
  }

  function render() {
    hideAll();
    setSubtitle();
    const phase = state.phase || 'idle';

    if (phase === 'idle' || phase === 'checking') {
      $('viewChecking').classList.remove('hidden');
      $('checkingText').textContent = state.message || '正在查询最新版本…';
      return;
    }

    if (phase === 'uptodate') {
      $('viewUpToDate').classList.remove('hidden');
      $('uptodateText').textContent = state.message || ('当前已是最新版本' + (state.current ? '（' + state.current + '）。' : '。'));
      $('btnClose').classList.remove('hidden');
      return;
    }

    if (phase === 'available') {
      $('viewAvailable').classList.remove('hidden');
      $('currentVer').textContent = state.current || '未知';
      $('latestVer').textContent = state.latest || '';
      $('notes').innerHTML = renderMarkdown(state.notes || '');
      const needUnverified = !state.sha;
      const canInstall = state.canInstall !== false;
      $('unverifiedBox').classList.toggle('hidden', !needUnverified || !canInstall);
      $('noInstallHint').classList.toggle('hidden', canInstall);
      $('btnLater').classList.remove('hidden');
      $('btnReleases').classList.remove('hidden');
      $('btnInstall').classList.remove('hidden');
      $('btnInstall').disabled = !canInstall;
      return;
    }

    if (order.includes(phase)) {
      $('viewProgress').classList.remove('hidden');
      renderProgress();
      return;
    }

    if (phase === 'done') {
      $('viewDone').classList.remove('hidden');
      $('doneTitle').textContent = (state.message && state.message.indexOf('回滚') >= 0) ? '回滚完成' : '更新完成';
      $('doneText').textContent = state.message || '';
      $('btnClose').classList.remove('hidden');
      return;
    }

    if (phase === 'error') {
      $('viewError').classList.remove('hidden');
      $('errorText').textContent = state.message || '未知错误';
      $('btnRetry').classList.remove('hidden');
      $('btnReleases').classList.remove('hidden');
      if (state.canRollback) $('btnRollback').classList.remove('hidden');
      $('btnClose').classList.remove('hidden');
      return;
    }

    $('viewChecking').classList.remove('hidden');
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderInline(escaped) {
    return escaped
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function renderMarkdown(markdown) {
    const lines = String(markdown).replace(/\r\n/g, '\n').split('\n');
    const out = [];
    let list = null, inCode = false;
    const code = [];
    const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };

    for (const raw of lines) {
      if (/^\s*```/.test(raw)) {
        if (inCode) {
          out.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>');
          code.length = 0;
          inCode = false;
        } else {
          closeList();
          inCode = true;
        }
        continue;
      }
      if (inCode) { code.push(raw); continue; }

      const line = raw.replace(/\s+$/, '');
      if (!line.trim()) { closeList(); continue; }

      let m = line.match(/^(#{1,6})\s+(.*)$/);
      if (m) {
        closeList();
        const level = m[1].length;
        out.push('<h' + level + '>' + renderInline(escapeHtml(m[2])) + '</h' + level + '>');
        continue;
      }
      if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeList(); out.push('<hr>'); continue; }
      m = line.match(/^\s*[-*+]\s+(.*)$/);
      if (m) {
        if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
        out.push('<li>' + renderInline(escapeHtml(m[1])) + '</li>');
        continue;
      }
      m = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (m) {
        if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
        out.push('<li>' + renderInline(escapeHtml(m[1])) + '</li>');
        continue;
      }
      m = line.match(/^\s*>\s?(.*)$/);
      if (m) {
        closeList();
        out.push('<blockquote>' + renderInline(escapeHtml(m[1])) + '</blockquote>');
        continue;
      }
      closeList();
      out.push('<p>' + renderInline(escapeHtml(line)) + '</p>');
    }

    closeList();
    if (inCode) out.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>');
    return out.join('\n');
  }

  function install() {
    const allow = $('allowUnverified').checked;
    $('btnInstall').disabled = true;
    send('install', { allowUnverified: allow });
  }

  $('btnLater').addEventListener('click', () => send('close'));
  $('btnClose').addEventListener('click', () => send('close'));
  $('btnRetry').addEventListener('click', () => send('check'));
  $('btnReleases').addEventListener('click', () => send('releases'));
  $('btnRollback').addEventListener('click', () => send('rollback'));
  $('btnInstall').addEventListener('click', install);

  window.chrome?.webview?.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.type !== 'state') return;
    state = Object.assign(state, data);
    $('btnInstall').disabled = false;
    render();
  });

  window.chrome?.webview?.postMessage({ type: 'ready' });
})();
</script>
</body>
</html>
