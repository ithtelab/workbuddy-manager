<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy Manager 安装程序</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#fff;color:#111;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;
  }
  .app{height:100vh;display:flex;flex-direction:column}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 56px;min-height:0}
  .logo-wrap{
    width:132px;height:132px;border-radius:50%;background:#fff;display:grid;place-items:center;
    box-shadow:0 18px 60px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05);margin-bottom:26px;
  }
  .logo-wrap svg{width:84px;height:84px}
  h1{font-size:27px;font-weight:700;letter-spacing:.2px;margin:0}
  .sub{font-size:13px;color:#8a8a8e;margin:10px 0 0}
  .views{width:100%;max-width:560px;margin-top:34px}
  .view{width:100%}
  .hidden{display:none !important}

  .field label{display:block;font-size:12.5px;color:#6b6b70;margin-bottom:8px}
  .path-row{display:flex;gap:8px}
  .path-row input{
    flex:1;min-width:0;font-size:13px;font-family:inherit;color:#111;
    background:#f5f5f7;border:1px solid #e5e5ea;border-radius:10px;padding:11px 12px;outline:none;
  }
  .path-row input:focus{border-color:#c7c7cc;background:#fff}
  .path-row button{
    appearance:none;border:1px solid #e5e5ea;background:#fff;color:#111;border-radius:10px;
    padding:0 16px;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .path-row button:hover{background:#f5f5f7}
  .hint{font-size:12px;color:#9a9aa0;line-height:1.7;margin-top:10px}
  .error{font-size:12.5px;color:#dc2626;background:rgba(220,38,38,.06);border-radius:10px;
    padding:10px 12px;margin-top:12px;white-space:pre-wrap;line-height:1.6}

  .progress{height:8px;border-radius:99px;background:#ececf1;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:#111;border-radius:99px;transition:width .25s ease}
  .progress-text{text-align:center;font-size:13px;color:#6b6b70;margin-top:16px}

  .done{display:flex;flex-direction:column;align-items:center;text-align:center}
  .done-icon{width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,.12);
    color:#16a34a;display:grid;place-items:center;font-size:30px;font-weight:700;margin-bottom:16px}
  .done-title{font-size:20px;font-weight:700}
  .done-dir{font-size:12px;color:#8a8a8e;margin-top:8px;word-break:break-all;max-width:520px}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:#3a3a3e;margin-top:30px;cursor:pointer}
  .check input{width:16px;height:16px;accent-color:#111;margin:0}

  .footer{padding:10px 56px 42px;display:flex;justify-content:center}
  .footer button{
    appearance:none;border:0;background:#111;color:#fff;border-radius:11px;
    width:220px;height:46px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:.15s;
  }
  .footer button:hover{opacity:.88}
  .footer button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="logo-wrap">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#1c1c1e"/>
        <circle cx="32" cy="11" r="4" fill="#f59e0b"/>
        <rect x="31" y="13" width="2" height="9" rx="1" fill="#e5e5e5"/>
        <rect x="16" y="22" width="32" height="26" rx="10" fill="#f4f4f5"/>
        <rect x="10" y="30" width="6" height="12" rx="3" fill="#f4f4f5"/>
        <rect x="48" y="30" width="6" height="12" rx="3" fill="#f4f4f5"/>
        <circle cx="26" cy="33" r="3.2" fill="#1c1c1e"/>
        <circle cx="38" cy="33" r="3.2" fill="#1c1c1e"/>
        <path d="M26 42c3 2.5 9 2.5 12 0" stroke="#1c1c1e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>WorkBuddy Manager</h1>
    <p class="sub">腾讯 CodeBuddy 账号池管理控制台</p>

    <div class="views">
      <div id="viewLocation" class="view">
        <div class="field">
          <label>安装位置</label>
          <div class="path-row">
            <input id="dir" spellcheck="false">
            <button id="browse">浏览…</button>
          </div>
          <div class="hint" id="hint"></div>
        </div>
        <div class="error hidden" id="errorBox"></div>
      </div>

      <div id="viewProgress" class="view hidden">
        <div class="progress"><i id="bar"></i></div>
        <div class="progress-text" id="progressText">正在准备…</div>
      </div>

      <div id="viewDone" class="view hidden done">
        <div class="done-icon">✓</div>
        <div class="done-title">安装完成</div>
        <div class="done-dir" id="doneDir"></div>
        <label class="check"><input type="checkbox" id="launch" checked><span>立即启动</span></label>
      </div>
    </div>
  </div>

  <div class="footer">
    <button id="primary">安装</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let mode = 'location';

  function post(type, extra) {
    window.chrome?.webview?.postMessage(Object.assign({ type }, extra || {}));
  }

  function view(name) {
    $('viewLocation').classList.toggle('hidden', name !== 'location');
    $('viewProgress').classList.toggle('hidden', name !== 'progress');
    $('viewDone').classList.toggle('hidden', name !== 'done');
    $('primary').classList.toggle('hidden', name === 'progress');
    $('primary').textContent = name === 'done' ? '完成' : '安装';
    mode = name;
  }

  $('browse').addEventListener('click', () => post('browse'));
  $('primary').addEventListener('click', () => {
    if (mode === 'done') {
      post('finish', { launch: $('launch').checked });
      return;
    }
    const dir = $('dir').value.trim();
    if (!dir) {
      $('errorBox').textContent = '请填写安装位置。';
      $('errorBox').classList.remove('hidden');
      return;
    }
    $('errorBox').classList.add('hidden');
    post('install', { dir });
  });

  window.chrome?.webview?.addEventListener('message', (event) => {
    const data = event.data;
    if (!data) return;
    if (data.type === 'init') {
      $('dir').value = data.dir || '';
      const size = data.sizeMb ? ('约 ' + data.sizeMb + ' MB') : '安装包内嵌运行时';
      $('hint').textContent = '需要 ' + size + ' 磁盘空间。安装后首次启动会自动登录（默认账号 admin）。';
      view('location');
    } else if (data.type === 'progress') {
      view('progress');
      const percent = Math.max(0, Math.min(100, Number(data.percent) || 0));
      $('bar').style.width = percent + '%';
      $('progressText').textContent = data.message || ('正在安装… ' + percent + '%');
    } else if (data.type === 'done') {
      $('doneDir').textContent = data.dir || '';
      view('done');
    } else if (data.type === 'error') {
      view('location');
      $('errorBox').textContent = data.message || '安装失败';
      $('errorBox').classList.remove('hidden');
    }
  });

  window.chrome?.webview?.postMessage({ type: 'ready' });
})();
</script>
</body>
</html>
