# WorkBuddy Manager —— 单容器部署（管理端 7864 + 账号池服务 7863）
#
# 用法：
#   1) 在本文件旁准备一个 ./data 目录（已有数据可原地复用）
#   2) docker compose up -d
#   3) 浏览器打开 http://<服务器IP>:7864
#      首启未设 WB_ADMIN_PASSWORD 时会随机生成并打印：
#      docker compose logs workbuddy-manager | grep -A2 密码
#
# 为什么只有一个服务：账号池服务（workbuddy2api）已经内置进本镜像，由容器入口
# 以同一 uid 拉起，监听 127.0.0.1:7863。这样不需要第二份源码、不需要对齐两个
# 容器的 uid、也不需要 docker.sock —— 这三样正是分离部署最容易出错的地方。
#
# 从源码构建（开发者）：
#   docker build -t workbuddy-manager:local .
#   然后在 .env 里写 WB_MANAGER_IMAGE=workbuddy-manager:local

services:
  workbuddy-manager:
    image: ${WB_MANAGER_IMAGE:-ghcr.io/ithtelab/workbuddy-manager:latest}
    container_name: workbuddy-manager
    # 容器版「一键更新」的前提：更新进程替换代码后自杀，靠它用新代码重新拉起。
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}

      # ── 数据布局（单根）──────────────────────────────
      # 容器内只挂一个根目录，面板与账号池服务各自取下面的子目录：
      #   /opt/workbuddy/manager/          面板数据库、管理员、日志
      #   /opt/workbuddy/workbuddy2api/    账号池服务 config.json、auths/、data/
      # 子目录由程序首次启动自建，宿主机不用预先建两层。
      WB_DATA_DIR: /opt/workbuddy/manager
      WB_AUTH_DIR: /opt/workbuddy/workbuddy2api/auths
      WB_UPSTREAM_CONFIG: /opt/workbuddy/workbuddy2api/config.json

      # ── 两个服务之间的连接 ───────────────────────────
      # 同一容器内，走回环地址即可；不需要服务名、host-gateway 或额外网络。
      WB2API_BASE: http://127.0.0.1:7863
      # 容器入口据它启动内置的账号池服务。默认就是 1，写出来只为一眼看懂。
      WB2API_EMBEDDED: "1"

      # ── 身份 ─────────────────────────────────────────
      # 留空 = 自动取挂载目录（./data）的属主，NAS 上不用开 SSH chown。
      # 想固定就填真实值：PUID=$(stat -c %u ./data)  PGID=$(stat -c %g ./data)
      # 填 0 无效：探测到 root 会回落 10001，业务进程不会以 root 运行。
      PUID: ${PUID:-}
      PGID: ${PGID:-}

      # 反向代理在后面时，真实 IP 取自它覆盖写入的 X-Real-IP
      WB_TRUST_PROXY: "1"
      # 子路径部署前缀（如 /workbuddy-manager），留空 = 根路径。
      # **必须与镜像构建时的 BASE_PATH 一致**，否则前端产物里的资源路径与后端
      # 剥前缀对不上，表现为「页面能打开、接口全 404」。取值写在同目录 .env 里。
      WB_BASE_PATH: ${WB_BASE_PATH:-}
      # 生产环境不暴露 /docs 与 /openapi.json
      WB_ENABLE_DOCS: "0"
      # 首启管理员密码；不设则随机生成并打印到日志。写在同目录 .env 里即可。
      WB_ADMIN_PASSWORD: ${WB_ADMIN_PASSWORD:-}
      # 出口代理 / GitHub 加速 / 默认线路（可选，写进同目录 .env）
      WB_HTTP_PROXY: ${WB_HTTP_PROXY:-}
      WB_UPDATE_PROXY: ${WB_UPDATE_PROXY:-}
      WB_GITHUB_MIRROR: ${WB_GITHUB_MIRROR:-}
      WB_DEFAULT_ACCOUNT_PROXY: ${WB_DEFAULT_ACCOUNT_PROXY:-}

    ports:
      # **只监听本机**：面板持有全部账号凭据，必须藏在反向代理之后。
      # 确需从别的机器直连，改成 "7864:7864"，但请先确保有 HTTPS 与访问控制。
      - "127.0.0.1:7864:7864"
      # 账号池服务的 7863 默认**不发布**：面板在容器内直连即可。
      # 只有「让别的机器/客户端直接连反代」时才需要放开，且务必限制来源：
      # - "127.0.0.1:7863:7863"

    volumes:
      # 唯一一条挂载：宿主机 ./data ↔ 容器内 /opt/workbuddy。
      # 不用预建 data/manager、data/workbuddy2api —— docker 逐条校验挂载源，
      # 少建一个就 Bind mount failed（群晖 Container Manager 尤其常见）。
      #
      # 想改用命名卷（数据不在宿主目录里，但免去属主问题）：
      #   在 .env 里写 WB_DATA_VOLUME=wb-workbuddy，并在文件末尾加：
      #   volumes:
      #     wb-workbuddy:
      - ${WB_DATA_VOLUME:-./data}:/opt/workbuddy

    # docker stop 时先转发 SIGTERM 给两个进程，uvicorn 的优雅退出上限是 20s，
    # 这里留 30s；否则账号池服务可能被 SIGKILL，正在落盘的 state.json 会写坏。
    stop_grace_period: 30s

    healthcheck:
      # 面板健康 + 内置账号池服务可达，两者都过才算 healthy。
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://127.0.0.1:7864/api/healthz
          && curl -fsS -o /dev/null http://127.0.0.1:7863/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
