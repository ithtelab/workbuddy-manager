# WorkBuddy Manager —— Docker Compose 部署
#
# 用法：
#   docker compose up -d
#   浏览器打开 http://<服务器IP>:7864
#   首启密码：docker compose logs workbuddy-manager | grep -A2 密码
#
# 镜像来源与数据卷见同目录 .env.example。

services:
  workbuddy-manager:
    # 默认拉上游官方镜像；fork 自建时在 .env 设 WB_MANAGER_IMAGE。
    image: ${WB_MANAGER_IMAGE:-ghcr.io/ithtelab/workbuddy-manager:latest}
    container_name: workbuddy-manager
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WB2API_BASE: http://host.docker.internal:7863
      WB_TRUST_PROXY: "1"
      WB_ENABLE_DOCS: "0"
      WB_HTTP_PROXY: ${WB_HTTP_PROXY:-}
      WB_UPDATE_PROXY: ${WB_UPDATE_PROXY:-}
      WB_GITHUB_MIRROR: ${WB_GITHUB_MIRROR:-}
      WB_DEFAULT_ACCOUNT_PROXY: ${WB_DEFAULT_ACCOUNT_PROXY:-}
      WB_ACCESS_LOG: ${WB_ACCESS_LOG:-0}
      WB_STARTUP_FAILURE_STACK: ${WB_STARTUP_FAILURE_STACK:-1}
    ports:
      # 只监听本机：请置于 HTTPS 反向代理之后（管理端持有全部账号凭据）。
      - "127.0.0.1:7864:7864"
    volumes:
      # 数据持久化。群晖/NAS 的 bind mount 属主常是 root（容器用 uid 10001），
      # 写不进去会报「无法打开数据库文件」：宿主执行 chown -R 10001:10001 ./data，
      # 或 .env 设 WB_DATA_VOLUME=wb-manager-data 改用命名卷（首次创建自动继承属主）。
      - ${WB_DATA_VOLUME:-./data}:/app/data
      # 上游服务数据目录：config.json、auths/、scripts/task_runner.py 都在这里。
      # 用官方发布包部署时，包内自带 upstream/，这行直接可用；数据随发布包更新。
      # 若你的目录不叫这个名字，只改冒号左边（宿主机路径），右边 /opt/workbuddy2api 不要动。
      - ./upstream:/opt/workbuddy2api
      # 需要在容器内更新上游/读日志时挂 docker.sock 并放开 group_add，见 deploy/README.md。
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"   # 宿主 socket 组：stat -c '%g' /var/run/docker.sock
    extra_hosts:
      # 让容器能通过 host.docker.internal 访问宿主机上的上游
      - "host.docker.internal:host-gateway"

volumes:
  wb-manager-data:
