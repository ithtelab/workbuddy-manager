# WorkBuddy Manager —— Docker Compose 部署
#
# 用法：
#   docker compose up -d
#   浏览器打开 http://<服务器IP>:7864
#   首启密码：docker compose logs workbuddy-manager | grep -A2 密码
#
# 镜像来源与数据卷见同目录 .env.example。

services:
  workbuddy-manager:
    # 默认拉上游官方镜像；fork 自建时在 .env 设 WB_MANAGER_IMAGE。
    image: ${WB_MANAGER_IMAGE:-ghcr.io/ithtelab/workbuddy-manager:latest}
    container_name: workbuddy-manager
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 容器内数据根：与下面 volumes 里唯一那条挂载一一对应（宿主机 ./data/ ↔ /opt/workbuddy）。
      # 这三项必须一起给 —— 账号池目录、启停脚本、日志路径都由它们推导出来。
      WB_DATA_DIR: /opt/workbuddy/manager
      WB_AUTH_DIR: /opt/workbuddy/workbuddy2api/auths
      WB_UPSTREAM_CONFIG: /opt/workbuddy/workbuddy2api/config.json
      WB2API_BASE: http://host.docker.internal:7863
      WB_TRUST_PROXY: "1"
      WB_ENABLE_DOCS: "0"
      WB_HTTP_PROXY: ${WB_HTTP_PROXY:-}
      WB_UPDATE_PROXY: ${WB_UPDATE_PROXY:-}
      WB_GITHUB_MIRROR: ${WB_GITHUB_MIRROR:-}
      WB_DEFAULT_ACCOUNT_PROXY: ${WB_DEFAULT_ACCOUNT_PROXY:-}
      WB_ACCESS_LOG: ${WB_ACCESS_LOG:-0}
      WB_STARTUP_FAILURE_STACK: ${WB_STARTUP_FAILURE_STACK:-1}
      # 初始管理员密码，仅首次启动（users.json 不存在）生效；留空则随机生成并打印到日志。
      WB_ADMIN_PASSWORD: ${WB_ADMIN_PASSWORD:-}
    ports:
      # 只监听本机：请置于 HTTPS 反向代理之后（管理端持有全部账号凭据）。
      - "127.0.0.1:7864:7864"
    volumes:
      # 只保留**一条**挂载：宿主机 ./data/ ↔ 容器内 /opt/workbuddy，两边子目录同名同构：
      #   data/manager/         管理网关数据（数据库、管理员账号、日志）→ /opt/workbuddy/manager
      #   data/workbuddy2api/   账号池服务数据（config.json、auths、scripts）→ /opt/workbuddy/workbuddy2api
      #
      # 为什么只挂一条：docker 会**逐条**校验挂载源，两条挂载就得先在宿主机建好两个子目录，
      # 少建一个立刻报「Bind mount failed: ... does not exist」起不来 —— 群晖 Container
      # Manager 与新版 docker 都是这个行为。收成一条后只校验 ./data 本身，两个子目录
      # 由程序首次启动时自建（server/config.py 的 ensure_dirs 用 parents=True）。
      #
      # 首次部署把根目录交给容器 uid（容器以 10001 运行），否则 SQLite 报「无法打开数据库文件」：
      #   mkdir -p data && sudo chown -R 10001:10001 data
      # 改不了属主（NFS/SMB）就 .env 设 WB_DATA_VOLUME=wb-manager-data 改用命名卷：
      # 卷首次创建会继承镜像内 /opt/workbuddy 的属主（10001），不需要 chown；
      # 代价是目录不在宿主机上，账号池源码要用 docker compose cp 放进去。
      - ${WB_DATA_VOLUME:-./data}:/opt/workbuddy
      # 需要在容器内更新账号池服务/读日志时挂 docker.sock 并放开 group_add，见 deploy/README.md。
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"   # 宿主 socket 组：stat -c '%g' /var/run/docker.sock
    extra_hosts:
      # 让容器能通过 host.docker.internal 访问宿主机上的账号池服务（workbuddy2api）
      - "host.docker.internal:host-gateway"

volumes:
  wb-manager-data:
