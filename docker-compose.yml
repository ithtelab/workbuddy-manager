# WorkBuddy Manager —— Docker Compose 部署
#
# 用法：
#   1) 按需修改下面的环境变量（至少确认上游地址与路径）
#   2) docker compose up -d --build
#   3) 浏览器打开 http://<服务器IP>:7864
#      首次启动若未设 WB_ADMIN_PASSWORD，会随机生成密码并打印到容器日志：
#      docker compose logs workbuddy-manager | grep -A2 密码
#
# 与宿主机安装（deploy/install.sh + systemd）的区别，见 Dockerfile 顶部说明。
# 简述：容器版**能**在界面上更新上游 —— 镜像内置了 docker CLI 与 compose 插件，
# 显式开启 docker.sock 挂载（见下方 volumes 的说明）即可在容器内重建上游容器。
# 默认**不挂**：把宿主 root 交给一个 Web 应用不该是默认状态。不挂时那几项
# 会降级为「请到宿主机操作」，界面如实提示。

services:
  workbuddy-manager:
    build:
      context: .
      # 可选：Alpine 软件源镜像（镜像基于 python:3.12-alpine）。
      # 官方源（dl-cdn.alpinelinux.org）国内偶有卡顿，填 mirrors.aliyun.com 可绕开。
      #   docker compose build --build-arg ALPINE_MIRROR=mirrors.aliyun.com
      #
      # DEBIAN_MIRROR 是旧版本的参数名，保留仅为兼容已有 compose（同样填 mirrors.aliyun.com
      # 即可）；新部署请用 ALPINE_MIRROR。两者都留空 = 官方源。
      # 可选镜像：mirrors.aliyun.com / mirrors.tuna.tsinghua.edu.cn / mirrors.ustc.edu.cn
      args:
        ALPINE_MIRROR: ""
        DEBIAN_MIRROR: ""
        # 容器时区。**必须与下面 environment 里的 TZ 一致**：
        #   · 构建期（这里）决定镜像里装不装 tzdata、/etc/localtime 指向哪；
        #   · 运行期（environment）只是把 TZ 传进进程环境。
        # 只设运行期而没装 tzdata 的话，Alpine 会让 localtime 静默退回 UTC ——
        # 按日统计与每日限额会按 UTC 分天，且不报错。
        #   docker compose build --build-arg TZ=Asia/Shanghai
        TZ: "Asia/Shanghai"
        # 可选：PyPI 镜像（成因同上——官方源走国际 CDN，国内会抖动/失败）。
        # 留空 = 官方源，失败时 Dockerfile 会自动降级到清华镜像重试。
        # 可选镜像：https://pypi.tuna.tsinghua.edu.cn/simple / https://mirrors.aliyun.com/pypi/simple
        PIP_INDEX_URL: ""
        # 可选：npm 依赖镜像。**只在需要容器内构建前端时用得上**（即工作区
        # 没有 web/out 的情况，如 git clone 部署）。成因与上面两个相同——
        # 官方 registry 国内访问慢且会断。
        #   docker compose build --build-arg NPM_REGISTRY=https://registry.npmmirror.com
        NPM_REGISTRY: ""
        # 可选：镜像里要装 docker CLI（供容器内「重载上游 / 读上游日志 / 一键更新」用），
        # 它的静态包固定从 download.docker.com 取——国外 CDN，国内实测很慢，
        # 构建会长时间停在这一步。填国内镜像基址可绕开。
        # 可选值：https://mirrors.aliyun.com/docker-ce / https://mirrors.tuna.tsinghua.edu.cn/docker-ce
        DOCKER_CLI_BASE: ""
        # 可选：compose 插件从 GitHub Releases 下载（官方地址国内会超时）。
        # 用法是「加速前缀 + 原始 URL」，例如 https://ghfast.top/
        COMPOSE_URL_PREFIX: ""
        # 可选：子路径部署前缀（如 /workbuddy-manager）。留空 = 部署在根路径。
        #
        # 容器版的前端是**构建期**编译进镜像的，所以前缀必须在 build 时传进来；
        # 与下面 environment 里的 WB_BASE_PATH 取值必须一致。
        #   docker compose build --build-arg BASE_PATH=/workbuddy-manager
        BASE_PATH: ""
    image: workbuddy-manager:latest
    container_name: workbuddy-manager
    # 这个 restart 策略是容器版「一键更新」能生效的前提：
    # 更新完成后容器内的进程会退出，靠它用新代码重新拉起。
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 数据根：与下面 volumes 里唯一那条挂载一一对应（宿主机 ./data/ ↔ /opt/workbuddy）。
      # 这三项必须一起给 —— 上游目录、启停脚本、日志路径都由它们推导出来。
      WB_DATA_DIR: /opt/workbuddy/manager
      WB_AUTH_DIR: /opt/workbuddy/workbuddy2api/auths
      WB_UPSTREAM_CONFIG: /opt/workbuddy/workbuddy2api/config.json
      # 首启管理员密码；不设则随机生成并打印到日志（推荐首启后立即改）
      # WB_ADMIN_PASSWORD: "改成你的强密码"
      # 上游地址：若上游与本品在同一 compose 网络，用服务名；否则填宿主机地址
      #   - 同网络（推荐）：http://workbuddy2api:7863
      #   - 用宿主机 Docker 网关：http://host.docker.internal:7863
      WB2API_BASE: http://host.docker.internal:7863
      # 可选：子路径部署前缀，必须与上面 build.args.BASE_PATH 完全一致（留空则都不填）。
      # 服务端用它补回响应里漏掉的站内地址，并在反代保留前缀时把前缀剥掉。
      # 详见 deploy/README.md 的「子路径部署」。
      # WB_BASE_PATH: /workbuddy-manager
      # 反向代理在后面时，真实 IP 取自它覆盖写入的 X-Real-IP
      WB_TRUST_PROXY: "1"
      # 生产环境不暴露 /docs 与 /openapi.json
      WB_ENABLE_DOCS: "0"
      # 出口代理（可选）：写在与本文件同目录的 .env 里即可，compose 用 ${} 取过来。
      # 支持 http:// / https:// / socks5://；内网与本机目标（含上游那一跳）始终直连。
      WB_HTTP_PROXY: ${WB_HTTP_PROXY:-}
      # 一键更新的下载代理（可选，只认 http/https）
      WB_UPDATE_PROXY: ${WB_UPDATE_PROXY:-}
      # GitHub 镜像加速（可选，issue #216）：国内机器直连 GitHub 超时时填基址，
      # 例如 https://gh-proxy.com/ 。版本检测与发布包下载先走镜像，失败回退直连。
      WB_GITHUB_MIRROR: ${WB_GITHUB_MIRROR:-}
      # 新账号默认绑定的命名线路（名字要在上游 config.json 的 proxies 里）
      WB_DEFAULT_ACCOUNT_PROXY: ${WB_DEFAULT_ACCOUNT_PROXY:-}
      # 容器内进程的 uid/gid。两项都留空 = 自动跟随 ./data 挂载目录的属主
      # （群晖上通常是 1026:100）—— 群晖/极空间用户什么都不用填就能起来。
      # 要固定就用宿主上的数字：id -u 用户名 / id -g 用户名，或 ls -ldn data。
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    ports:
      # **只监听本机**：管理端必须藏在反向代理之后。
      # 若确需直接从别的机器访问，改成 "7864:7864"，但请先确保有 HTTPS 与访问控制——
      # 管理端持有全部账号凭据，直接暴露到公网是被打穿的常见原因。
      - "127.0.0.1:7864:7864"
    volumes:
      # 数据库、日志、更新状态、上游版本固定标记，以及上游的 config.json / auths /
      # scripts 都在这里。必须持久化，否则重建容器会丢失统计与审计记录。
      #
      # **只保留一条挂载**：宿主机 `./data/` ↔ 容器内 `/opt/workbuddy`，两边子目录
      # 同名同构 ——
      #   data/manager/        管理端数据库、管理员账号、日志
      #   data/workbuddy2api/  上游 config.json、auths/、scripts/（见下面一段）
      #
      # 属主不用手工处理：镜像入口会把容器进程的 uid/gid 对齐到本目录的属主
      # （见 environment 里的 PUID/PGID），群晖/极空间/Unraid 直接 up -d 即可，
      # 不必开 SSH。只有 WB_FIX_OWNERSHIP=0、或目录无法 chown（NFS/SMB）时才手工：
      #   mkdir -p data && sudo chown -R 10001:10001 data
      # 那种情况也可 .env 设 WB_DATA_VOLUME=wb-manager-data 改用命名卷：
      # 卷首次创建会继承镜像内 /opt/workbuddy 的属主，不需要 chown；
      # 代价是目录不在宿主机上，账号池源码要用 docker compose cp 放进去。
      - ${WB_DATA_VOLUME:-./data}:/opt/workbuddy
      # 上游数据在同一条挂载里（`data/workbuddy2api/` → `/opt/workbuddy/workbuddy2api`，
      # 由上面的 WB_AUTH_DIR / WB_UPSTREAM_CONFIG 指定）。一次挂载覆盖下面三件事
      # （分开挂子路径会互相重叠，反而让权限语义变模糊）：
      #   · 读/写上游 config.json —— 管理端「设置」页保存的目标
      #   · 读/写 auths/ —— 扫码添加账号会落盘 workbuddy-<uid>.json（见
      #     tencent.write_auth_file），所以**不能只读**
      #   · 读上游 docker-compose.yml 做端口收敛；「更新上游」时在容器内
      #     git fetch/pull 并重建上游容器
      #
      # **权限提示（与上游 issue #108 同款问题）**：bind mount 的目录属主由宿主机
      # 决定，镜像内的 chown 不起作用。若管理端显示「0 个账号」而 auths 里明明有
      # 文件，或添加账号报权限错误，通常是跨 uid 读写不到——宿主机执行一次：
      #   chown -R 10001:10001 ./data/workbuddy2api/auths
      # （10001 是上游容器内进程的 uid，管理端也用同一 uid，见 Dockerfile）
      #
      # 若你**不想**让管理端碰上游仓库（例如上游由别人维护），把它移出 ./data 单独
      # 挂一条子路径即可：此时「更新上游」会不可用，界面会如实提示。
      # docker 控制套接字：**默认不挂**（opt-in）。
      #
      # **安全性说明（值得读）**：挂 docker.sock 等于把宿主 root 权限交给本容器
      # （`docker run -v /:/host` 即可拿到宿主文件系统）。管理端是持有全部账号
      # 凭据的高价值目标，Web 应用被攻破的可能性永远不为零，所以这不该是默认
      # 状态。需要「保存设置后自动重载上游 / 读上游日志 / 一键更新上游」这些
      # 界面功能时，把下面这行与文件末尾的 group_add 一并取消注释，并把宿主
      # socket 的真实 GID 写进 .env（见 deploy/README.md「容器内操作 docker」）。
      #
      # 不挂时依赖 docker 的功能会自动降级为「请到宿主机执行 docker compose ...」，
      # 界面如实提示，不会静默失败。
      #
      # - /var/run/docker.sock:/var/run/docker.sock

    # 与上面的挂载配套（同样默认注释掉）：
    # 挂上 socket 只是必要条件 —— 还得**进得了那个组**。宿主的 socket 通常归
    # root:docker（GID 998/999），而本容器以 uid 10001 运行，不在那个组里就是
    # permission denied。GID 因机器而异，所以用变量：
    #   DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)   # 写进 .env
    # 默认 999 是 Debian/Ubuntu 上最常见的值；取错了不会静默失败 —— 更新上游时
    # 会给出取真实 GID 的提示。
    # group_add:
    #   - "${DOCKER_GID:-999}"

    extra_hosts:
      # 让容器能通过 host.docker.internal 访问宿主机上的上游
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7864/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# 顶层卷声明：只在 .env 里设置 WB_DATA_VOLUME=wb-manager-data 时才会被引用。
# 默认（未设变量）仍走 ./data，这个卷不会被写入数据，也不影响已有部署。
volumes:
  wb-manager-data:
