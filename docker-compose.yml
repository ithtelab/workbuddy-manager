# WorkBuddy Manager —— Docker Compose 部署
#
# 用法：
#   docker compose up -d
#   浏览器打开 http://<服务器IP>:7864
#   首启密码：docker compose logs workbuddy-manager | grep -A2 密码
#
# 镜像来源与数据卷见同目录 .env.example。

services:
  workbuddy-manager:
    # 默认拉上游官方镜像；fork 自建时在 .env 设 WB_MANAGER_IMAGE。
    image: ${WB_MANAGER_IMAGE:-ghcr.io/ithtelab/workbuddy-manager:latest}
    container_name: workbuddy-manager
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WB2API_BASE: http://host.docker.internal:7863
      WB_TRUST_PROXY: "1"
      WB_ENABLE_DOCS: "0"
      WB_HTTP_PROXY: ${WB_HTTP_PROXY:-}
      WB_UPDATE_PROXY: ${WB_UPDATE_PROXY:-}
      WB_GITHUB_MIRROR: ${WB_GITHUB_MIRROR:-}
      WB_DEFAULT_ACCOUNT_PROXY: ${WB_DEFAULT_ACCOUNT_PROXY:-}
      WB_ACCESS_LOG: ${WB_ACCESS_LOG:-0}
      WB_STARTUP_FAILURE_STACK: ${WB_STARTUP_FAILURE_STACK:-1}
      # 初始管理员密码，仅首次启动（users.json 不存在）生效；留空则随机生成并打印到日志。
      WB_ADMIN_PASSWORD: ${WB_ADMIN_PASSWORD:-}
    ports:
      # 只监听本机：请置于 HTTPS 反向代理之后（管理端持有全部账号凭据）。
      - "127.0.0.1:7864:7864"
    volumes:
      # 宿主机只需一个目录 ./data/，两个组件各占一个子目录（互为兄弟，不嵌套）：
      #   data/manager/         管理网关数据（数据库、管理员账号、日志）→ /app/data
      #   data/workbuddy2api/   账号池服务数据（config.json、auths、scripts）→ /opt/workbuddy2api
      # 首次部署先把目录交给容器 uid，否则 SQLite 会报「无法打开数据库文件」：
      #   mkdir -p data/manager && sudo chown -R 10001:10001 data/manager
      # 改不了属主（NFS/SMB）就 .env 设 WB_DATA_VOLUME=wb-manager-data 改用命名卷。
      - ${WB_DATA_VOLUME:-./data/manager}:/app/data
      # 账号池数据目录：config.json、auths/、scripts/task_runner.py 都在这里。
      # 该目录不存在时容器会直接报「Bind mount failed: ... does not exist」起不来：
      # 先把账号池源码放进去，或只改冒号左边（宿主机路径），右边 /opt/workbuddy2api 不要动。
      - ./data/workbuddy2api:/opt/workbuddy2api
      # 需要在容器内更新账号池服务/读日志时挂 docker.sock 并放开 group_add，见 deploy/README.md。
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"   # 宿主 socket 组：stat -c '%g' /var/run/docker.sock
    extra_hosts:
      # 让容器能通过 host.docker.internal 访问宿主机上的账号池服务（workbuddy2api）
      - "host.docker.internal:host-gateway"

volumes:
  wb-manager-data:
